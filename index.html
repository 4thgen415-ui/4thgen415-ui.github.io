    <script>
      // Tunnel previews (trycloudflare, etc.): drop any service worker before the
      // app bundle loads. A stale SW from an earlier visit causes a blank white screen.
      (function () {
        var h = location.hostname;
        if (!/trycloudflare\.com$|\.loca\.lt$|\.localhost\.run$/.test(h)) return;
        if (!('serviceWorker' in navigator)) return;
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { r.unregister(); });
        });
        if ('caches' in window) {
          caches.keys().then(function (keys) {
            keys.forEach(function (k) { caches.delete(k); });
          });
        }
      })();
    </script>
    <meta name="theme-color" content="#F4F4F3" />
    <script>
      // Apply the saved / system theme before paint to avoid a flash of the wrong scheme.
      (function () {
        try {
          var t = localStorage.getItem('bbm-theme');
          var dark = t === 'dark' || ((!t || t === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', '#111215');
          }
        } catch (e) {}
      })();
    </script>

    <!--
      Original boot flash. Art + timing from 2348edf
      frontend/src/components/chat/ChatSplash.tsx (first live bundle
      4thgen415-ui.github.io ec89cda5). Markup/handoff from
      docs/prototype.html (e84a08a). CSS from 0413015
      frontend/src/index.css .startup-splash-host. Inline so it types
      before the app bundle finishes loading. Not ChatSplash.
    -->
    <style>#startupSplashHost{--paper:#fff;--proof:#1b37be;z-index:10000;pointer-events:none;position:fixed;inset:0}#startupSplashHost .splash{z-index:60;background:var(--paper);cursor:pointer;pointer-events:auto;place-items:center;transition:opacity .5s,visibility .5s;display:grid;position:absolute;inset:0}#startupSplashHost[hidden],#startupSplashHost .splash.gone{opacity:0;visibility:hidden;cursor:default;pointer-events:none!important;display:none!important}#startupSplashHost .splash pre{color:#131313;white-space:pre;letter-spacing:0;margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:clamp(8px,3.15vw,14px);font-weight:700;line-height:1.35}#startupSplashHost .splash .cur{background:var(--proof);vertical-align:-.18em;width:.62em;height:1.05em;animation:.62s steps(2,end) infinite chat-sblink;display:inline-block}@keyframes chat-sblink{50%{opacity:0}}</style>
    <div class="startup-splash-host" id="startupSplashHost">
      <div class="splash" id="splash" role="img" aria-label="Blaine">
        <div>
          <pre id="splashArt"></pre>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var A1 = '|__| .       |,          />       .';
        var A2 = '|  | |   ,   | /\\/\\     /> |_ /-\\ | |\\| [-';
        var el = document.getElementById('splashArt');
        var box = document.getElementById('splash');
        var host = document.getElementById('startupSplashHost');
        if (!el || !box) return;
        var cols = Math.max(A1.length, A2.length);
        var i = 0;
        var timer;
        var finished = false;
        var marked = false;
        function splashApi() {
          var h = location.hostname;
          if (h === 'blaine.chat' || h === 'www.blaine.chat') return 'https://api.blaine.chat/api/splash';
          return '/api/splash';
        }
        function cookieSeen() {
          try {
            return /(?:^|;\\s*)blaine_splash_seen=1(?:;|$)/.test(document.cookie || '');
          } catch (e) {
            return false;
          }
        }
        function paint(n, cursor) {
          el.textContent = '';
          el.appendChild(document.createTextNode(A1.slice(0, n) + '\n'));
          el.appendChild(document.createTextNode(A2.slice(0, n)));
          if (cursor) {
            var c = document.createElement('span');
            c.className = 'cur';
            el.appendChild(c);
          }
        }
        function drop() {
          box.classList.add('gone');
          box.style.pointerEvents = 'none';
          box.style.cursor = 'default';
          if (host) {
            host.hidden = true;
            host.style.display = 'none';
            host.style.pointerEvents = 'none';
            if (host.parentNode) host.parentNode.removeChild(host);
          }
        }
        function markSeen() {
          if (marked) return;
          marked = true;
          try {
            fetch(splashApi(), { method: 'POST', credentials: 'include', keepalive: true }).catch(function () {});
          } catch (e) {}
        }
        function finish() {
          if (finished) return;
          finished = true;
          if (timer) clearInterval(timer);
          paint(cols, false);
          markSeen();
          setTimeout(drop, 1000);
        }
        function play() {
          if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            paint(cols, false);
            setTimeout(finish, 300);
          } else {
            paint(0, true);
            var tick = Math.max(16, Math.round(1000 / cols));
            timer = setInterval(function () {
              i += 1;
              if (i >= cols) {
                paint(cols, false);
                finish();
                return;
              }
              paint(i, true);
            }, tick);
          }
          box.addEventListener('pointerdown', function () {
            if (finished) return;
            finished = true;
            if (timer) clearInterval(timer);
            markSeen();
            drop();
          });
        }
        // Once per IP: cookie is a fast path; API is the source of truth.
        if (cookieSeen()) {
          drop();
          return;
        }
        var decided = false;
        var gate = setTimeout(function () {
          if (decided) return;
          decided = true;
          play();
        }, 900);
        try {
          fetch(splashApi(), { method: 'GET', credentials: 'include' })
            .then(function (r) { return r.ok ? r.json() : { seen: false }; })
            .then(function (data) {
              if (decided) return;
              decided = true;
              clearTimeout(gate);
              if (data && data.seen) drop();
              else play();
            })
            .catch(function () {
              if (decided) return;
              decided = true;
              clearTimeout(gate);
              play();
            });
        } catch (e) {
          clearTimeout(gate);
          play();
        }
      })();
    </script>
